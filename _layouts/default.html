<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ site.url }}{{ page.url | relative_url }}">
{%- assign og_image = page.image | default: '/assets/og-cover.png' -%}
<meta property="og:image" content="{{ site.url }}{{ og_image | relative_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ site.url }}{{ og_image | relative_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="alternate icon" href="{{ '/assets/favicon-32.png' | relative_url }}" type="image/png">
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="shell masthead__inner">
    <nav class="masthead__nav" aria-label="Pages">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.url == '/index.html' %} aria-current="page"{% endif %}>The framework</a>
      <a href="{{ '/sample/' | relative_url }}"{% if page.url == '/sample/' %} aria-current="page"{% endif %}>Review</a>
    </nav>
  </div>
</header>

<main id="main">
{{ content }}
</main>

<footer class="foot">
  <div class="shell">
    <div class="byline byline--foot">
      <div>
        <b>{{ site.data.author.name }}</b>
      </div>
      <ul>
        {% for link in site.data.author.links %}
        <li><a href="{{ link.url }}" rel="me noopener">{{ link.label }}</a></li>
        {% endfor %}
      </ul>
    </div>
    <p>Content CC BY 4.0; site code MIT.</p>
  </div>
</footer>
</body>
</html>
