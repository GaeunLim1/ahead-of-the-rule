cases:
  - key: affiliates
    name: US Affiliates Rule
    url: /affiliates/
    j: us
    link: Spares, consumables and service for fabs owned by listed parties; dealings with listed chipmakers' subsidiaries abroad
    link_short: Spares and service, not leading-edge tools
    dependency: Not applicable
    mechanism: Ownership
    scope: 50% or more owned by listed parties, directly or indirectly, alone or together
    timing: Legal date 10 Nov 2026; announced 10 Jan 2027
    timing_short: 10 Nov 2026 in law; 10 Jan 2027 announced
    jurisdiction: Linked to China Ann. 61
    uncertain: Overlap with existing US controls on chipmaking in China
    creates: Time gap and information gap
  - key: ann61
    name: China Announcement 61
    url: /announcement-61/
    j: cn
    link: Tb, Dy and SmCo magnets in vacuum pumps, wafer robots, linear motors and cathodes; rare-earth sputtering targets
    link_short: Equipment parts and deposition targets
    dependency: High
    mechanism: Material content
    scope: 0.1% of value; parts and modules containing listed magnets; case by case for logic at 14 nm or below and memory at 256 layers or more
    timing: Same as the Affiliates Rule, linked
    timing_short: 10 Nov 2026 in law; 10 Jan 2027 announced
    jurisdiction: Linked to the US Affiliates Rule
    uncertain: Whether 0.1% is measured on the module or on the whole tool
    creates: Time gap, information gap and supply disruption
